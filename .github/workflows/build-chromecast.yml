name: Build Chromecast APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromecast-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure the official Nuvio account server
        run: |
          python3 - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          backend = 'https://api.nuvio.tv'
          with urlopen(f'{backend}/.well-known/nuvio', timeout=30) as response:
              config = json.load(response)
          if config['service'] != 'nuvio' or config['backend_url'].rstrip('/') != backend:
              raise SystemExit('Unexpected Nuvio discovery configuration')
          key = config['publishable_key']
          publishable = re.fullmatch(r'sb_publishable_[A-Za-z0-9_-]+', key)
          if not publishable:
              if not re.fullmatch(r'[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', key):
                  raise SystemExit('Invalid public Nuvio client key format')
              payload = key.split('.')[1]
              claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
              if claims.get('role') != 'anon':
                  raise SystemExit('Only an anonymous client key may be included in the APK')
          request = Request(f'{backend}/auth/v1/settings', headers={'apikey': key})
          with urlopen(request, timeout=30) as response:
              if not json.load(response)['external']['email']:
                  raise SystemExit('Nuvio email authentication is unavailable')
          Path('local.properties').write_text(
              f'NUVIO_SUPABASE_URL={backend}\nNUVIO_SUPABASE_ANON_KEY={key}\n',
              encoding='utf-8',
          )
          print('Verified the official Nuvio email authentication endpoint.')
          PY
      - name: Build arm64-v8a APK
        run: |
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pnuvio.android.arm64Only=true --stacktrace
      - name: Verify APK signature and arm64-v8a libraries
        run: |
          set -euo pipefail
          output_dir=androidApp/build/outputs/apk/full/debug
          mapfile -t apks < <(find "$output_dir" -maxdepth 1 -type f -name '*arm64-v8a*.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' | sort -u)"
          test "$abis" = arm64-v8a
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" dist/nuvio-chromecast-arm64-v8a.apk
          cd dist
          sha256sum nuvio-chromecast-arm64-v8a.apk | tee nuvio-chromecast-arm64-v8a.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: nuvio-chromecast-arm64-v8a
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuvio-chromecast-arm64-v8a
          path: dist
      - name: Publish verified APK as a GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c nuvio-chromecast-arm64-v8a.apk.sha256
          tag="1.0.0-chromecast.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.apk ./*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" ./*.apk ./*.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Nuvio 1.0.0 with Google Cast (arm64-v8a)' \
              --notes 'Unofficial, debug-signed Android build based on NuvioMobile 1.0.0 and PR #2523. This build configures the official Nuvio account server. Google Cast supports direct HTTP(S) video sources without custom request headers.'
          fi
