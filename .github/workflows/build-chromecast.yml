name: Build Chromecast APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromecast-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare runtime properties
        run: touch local.properties
      - name: Build arm64-v8a APK
        run: |
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pnuvio.android.arm64Only=true --stacktrace
      - name: Verify APK signature and arm64-v8a libraries
        run: |
          set -euo pipefail
          output_dir=androidApp/build/outputs/apk/full/debug
          mapfile -t apks < <(find "$output_dir" -maxdepth 1 -type f -name '*arm64-v8a*.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' | sort -u)"
          test "$abis" = arm64-v8a
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" dist/nuvio-chromecast-arm64-v8a.apk
          cd dist
          sha256sum nuvio-chromecast-arm64-v8a.apk | tee nuvio-chromecast-arm64-v8a.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: nuvio-chromecast-arm64-v8a
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuvio-chromecast-arm64-v8a
          path: dist
      - name: Publish verified APK as a GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c nuvio-chromecast-arm64-v8a.apk.sha256
          tag="1.0.0-chromecast.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.apk ./*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" ./*.apk ./*.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Nuvio 1.0.0 with Google Cast (arm64-v8a)' \
              --notes 'Unofficial, debug-signed Android build based on NuvioMobile 1.0.0 and PR #2523. Google Cast supports direct HTTP(S) video sources without custom request headers.'
          fi
